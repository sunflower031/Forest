{rule:'Сначала примени общее правило конкретного корня, затем обязательно проверь исключения. Не переноси одно правило на все чередующиеся корни: условия у разных групп различаются.',example:'Нейтральный пример: в слове «раздирать» после определения корня проверяют наличие суффикса -а-.'},
{rule:'Вспомни определение понятия «корень слова». Чтобы установить корень, определи лексическое значение слова и подбери однокоренные слова. Не делай вывод только по совпадению букв.',example:''},
{rule:'Вспомни, что такое корень слова и как устроены сложные слова. Определи значимые части самостоятельно и найди среди них корень с чередованием.',example:''},
{rule:'При работе с текстом сначала найди слова-кандидаты, затем для каждого установи значение корня и условие написания. Проверяй весь текст, а не только знакомые сочетания букв.',example:'Нейтральный пример: после первого чтения можно отметить несколько кандидатов, а окончательный выбор сделать только после проверки их корней.'}
];

let state={screen:'start',i:0,answers:[],selected:[],retry:false,retryList:[],retryPos:0,reflection:''};
const scene=document.querySelector('#scene'),map=document.querySelector('#map');
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function fillMarkup(word,n){let value=state.fillValues?.[n]||'',parts=word.split('..');return `${esc(parts[0])}<span class="slot" aria-label="пропущенная буква">${esc(value)}</span>${esc(parts[1]||'')}`}
function chooseFillCard(n){state.activeFill=n;document.querySelectorAll('.fill-card').forEach(b=>b.classList.toggle('active',+b.dataset.n===n));document.querySelector('#fillHelp').textContent=`Вставь букву в слово «${tasks[state.retry?state.retryList[state.retryPos]:state.i].o[n]}» с клавиатуры или выбери ниже.`}
function putLetter(letter,q){if(state.activeFill==null)return;state.fillValues[state.activeFill]=letter.toLowerCase();let card=document.querySelector(`[data-n="${state.activeFill}"]`);card.innerHTML=fillMarkup(q.o[state.activeFill],state.activeFill);card.classList.add('filled');card.classList.remove('active');card.setAttribute('aria-label',q.o[state.activeFill].replace('..',letter)+'. Нажмите ещё раз, чтобы выбрать как ответ.');let next=q.o.findIndex((_,i)=>!state.fillValues[i]);state.activeFill=next<0?null:next;if(next>=0)chooseFillCard(next);else document.querySelector('#fillHelp').textContent='Все пропуски заполнены. Теперь выбери карточки, которые отвечают на вопрос. Если хочешь исправить букву, нажми прямо на подчёркнутую букву в нужной карточке.'}
function renderMap(){map.innerHTML='<h2>Карта спасения</h2>'+skills.map((s,n)=>{let current=state.screen==='task'?tasks[state.i]?.s:state.screen==='start'?0:5,done=state.answers.filter(a=>a&&tasks[a.index].s===n).length>=6;return `<div class="map-step ${done?'done':''} ${current===n?'active':''}"><div class="dot">${done?'✓':n+1}</div><div><strong>${s.place}</strong><small><img class="map-avatar" src="02_assets/${done?s.asset:'owl_guardian.png'}" alt="">${done?s.resource:'Сова ждёт помощи'}</small></div></div>`}).join('')}
function progress(){let n=state.answers.filter(a=>a.correct).length;document.querySelector('#progressText').textContent=`Путь: ${n} из 30`;document.querySelector('#seriesText').textContent=state.screen==='task'?`Локация ${tasks[state.i].s+1}/5`:state.screen==='final'?'Лес спасён':'Миссия';document.querySelector('.track').setAttribute('aria-valuenow',n);document.querySelector('#fill').style.width=(n/30*100)+'%'}
function renderStart(){state.screen='start';scene.innerHTML=`<div class="hero intro-hero"><span class="badge">Миссия по русскому языку · 6–11 класс</span><h1>Лес теряет свои корни</h1><p>Наводнение, огонь и туман разорвали лесные тропы. Ты — герой-собиратель: освой пять навыков и верни жителям всё, что поможет спасти дом.</p></div><div class="content"><div class="start-grid"><div class="card"><h2>Твоя учебная цель</h2><p>Систематизировать корни с чередованием, выбирать верную гласную, помнить исключения и отличать омонимичные корни в словах и тексте.</p><div class="resource character-callout"><img src="02_assets/owl_guardian.png" alt="Сова-хранитель"><span>Сова-хранитель будет выдавать детали после каждой серии.</span></div><button class="primary" id="start">Начать миссию</button></div><div class="card"><h2>Как действовать</h2><ol><li>Прочитай условие.</li><li>При необходимости открой «Теорию».</li><li>Выбери ответ и проверь.</li><li>Ошибки можно повторить в РНО.</li></ol><p><b>Доска</b> открывается поверх задания и не влияет на попытки.</p></div></div></div>`;document.querySelector('#start').onclick=()=>{state.screen='task';renderTask()};sync()}
function currentTask(){return tasks[state.retry?state.retryList[state.retryPos]:state.i]}
function shuffled(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function optionOrder(q){
  let all=q.o.map((_,i)=>i);
  // В лабиринте, заданиях на состав слова и вставку букв порядок является частью механики.
  if(q.paint||['maze','mazePath','paint'].includes(q.type))return all;

  const taskId=tasks.indexOf(q);
  const storageKey=`worldbuild:last-order:${taskId}`;
  let previous='';
  try{previous=localStorage.getItem(storageKey)||''}catch(e){}

  function makeOrder(){
    let answers=[].concat(q.a);
    // Если верных вариантов ровно два, разводим их по разным участкам сетки,
    // но сами позиции тоже рандомизируются.
    if(q.type==='multi'&&answers.length===2&&q.o.length>=4){
      let patterns=q.o.length===4?[[0,3],[1,2]]:q.o.length===5?[[0,4],[1,3]]:[];
      if(patterns.length){
        let correct=shuffled(answers),
            wrong=shuffled(all.filter(i=>!answers.includes(i))),
            pattern=patterns[Math.floor(Math.random()*patterns.length)],
            order=Array(q.o.length),
            rest=all.filter(i=>!pattern.includes(i));
        order[pattern[0]]=correct[0];
        order[pattern[1]]=correct[1];
        rest.forEach((pos,i)=>order[pos]=wrong[i]);
        return order;
      }
    }
    return shuffled(all);
  }

  let order=makeOrder(), tries=0;
  const original=all.join(',');
  const bad=o=>o.join(',')===previous || o.join(',')===original || (o.length>=4 && o.some((v,i)=>v===i));
  // Для обычных карточек добиваемся заметного перемешивания:
  // не повторяем прошлый порядок, не оставляем исходный и по возможности
  // не оставляем ни один вариант на его прежней позиции.
  while(bad(order) && tries<80){
    order=makeOrder();
    tries++;
  }
  // Если строгая развязка невозможна из-за ограничений конкретного задания,
  // всё равно гарантируем хотя бы не исходный и не предыдущий порядок.
  if(order.join(',')===original || order.join(',')===previous){
    tries=0;
    do{order=makeOrder();tries++;}while((order.join(',')===original || order.join(',')===previous) && tries<80);
  }
  try{localStorage.setItem(storageKey,order.join(','))}catch(e){}
  return order;
}
function contextMarkup(q){let i=0;return q.contextText.split('\n').map(line=>{let s=line.replace(/[\p{L}Ёё]+(?:-[\p{L}Ёё]+)*/gu,m=>`<button class="context-word" data-n="${i++}" aria-pressed="false">${esc(m)}</button>`);s=s.replace(/<\/button>\s+([,.;:!?…)\]»])/g,'</button>$1');return `<div class="verse-line">${s}</div>`}).join('')}
function classifyMarkup(q){return `<div class="sort-tray">${q.o.map((x,n)=>`<button class="sort-chip" data-sort="${n}">${esc(x)}</button>`).join('')}</div><div class="baskets">${q.bins.map((x,b)=>`<section class="basket"><h3>${esc(x)}</h3><div class="basket-drop" data-bin="${b}"></div><div class="basket-note">Выбери сочетание, затем корзинку</div></section>`).join('')}</div>`}

function cardLayoutClass(q){
  if(q.type==='maze'||q.type==='mazePath'||q.type==='context'||q.type==='classify'||q.type==='paint')return '';
  if(q.type==='fillMulti')return 'layout-two';
  const count=q.o?.length||0;
  const maxLen=Math.max(0,...(q.o||[]).map(x=>String(x).replace(/<[^>]+>/g,'').length));
  const avgLen=count?Math.round((q.o||[]).reduce((s,x)=>s+String(x).replace(/<[^>]+>/g,'').length,0)/count):0;
  if(maxLen>=34 || avgLen>=25) return 'layout-one';
  if(count>=8) return 'layout-two';
  if(count===6) return maxLen>20?'layout-two':'layout-three';
  if(count===5) return 'layout-one';
  if(count===4) return maxLen>24?'layout-one':'layout-two';
  return count<=3?'layout-one':'layout-two';
}
function renderTask(){
state.screen='task';
let real=state.retry?state.retryList[state.retryPos]:state.i,q=tasks[real],sk=skills[q.s],hint=skillHints[q.s],order=optionOrder(q);
state.selected=[];state.classified=q.type==='classify'?Array(q.o.length).fill(null):null;state.sortActive=null;

let cls=(q.type==='maze'||q.type==='mazePath')?'options maze':(q.type==='multi'||q.type==='fillMulti')?'word-grid':'options'; if(real===5) cls+=' single-column';

let fillTray=q.type==='fillMulti'?'<p class="fill-help" id="fillHelp">Выбери букву для первой карточки с клавиатуры или нажми кнопку.</p><div class="letter-tray" aria-label="Выбор буквы"><button data-letter="а">а</button><button data-letter="о">о</button><button data-letter="е">е</button><button data-letter="и">и</button></div>':'';

let taskBody='';
if(q.type==='context'){
  taskBody=`<div class="context-line" id="options" aria-label="Текст задания">${contextMarkup(q)}</div>${q.contextSource?`<div class="context-source">${esc(q.contextSource)}</div>`:''}`;
}else if(q.type==='classify'){

}else{

}

scene.innerHTML=`<div class="hero"><span class="badge">${state.retry?'РНО · работа над ошибками':`Серия ${q.s+1} · задание ${real%6+1}/6`}</span><h1>${sk.place}</h1><p>${q.s===0?'Вода прибывает. Разложи правила по верным маршрутам.':q.s===1?'Останови огонь точными решениями.':q.s===2?'Фонарь зажжётся, если отличить похожие корни.':q.s===3?'Найди скрытые корни и восстанови тропу.':'Подай верный сигнал всему лесу.'}</p></div><div class="content"><div class="task-head"><div><div class="kicker">Навык: ${sk.name}</div><h2>${state.retry?'Повторяем ошибку':'Продолжай спасение'}</h2></div><button class="theory-btn" id="theoryBtn" aria-expanded="false" aria-controls="theoryCard">Теория</button></div><div class="theory" id="theoryCard" hidden><strong>Подсказка по текущему навыку</strong><p>${hint.rule}</p>${hint.example?`<p class="example">${hint.example}</p>`:''}</div><div class="prompt">${q.p}</div>${taskBody}<div id="feedback" aria-live="assertive"></div><div class="actions"><button class="primary" id="check" disabled>Проверить</button></div></div>`;

let tb=document.querySelector('#theoryBtn'),tc=document.querySelector('#theoryCard');
tb.onclick=()=>{let open=tb.getAttribute('aria-expanded')==='true';tb.setAttribute('aria-expanded',String(!open));tc.hidden=open};

if(q.type==='classify'){
  const refresh=()=>{
    document.querySelectorAll('[data-sort]').forEach(b=>{let n=+b.dataset.sort;b.classList.toggle('assigned',state.classified[n]!=null);b.style.outline=state.sortActive===n?'3px solid var(--gold)':''});
    document.querySelectorAll('[data-bin]').forEach(z=>{let bin=+z.dataset.bin;z.innerHTML=state.classified.map((v,n)=>v===bin?`<button class="basket-chip" data-unassign="${n}">${esc(q.o[n])}</button>`:'').join('')});
    document.querySelectorAll('[data-unassign]').forEach(b=>b.onclick=e=>{e.stopPropagation();state.classified[+b.dataset.unassign]=null;refresh()});
    document.querySelector('#check').disabled=state.classified.some(v=>v==null)
  };
  document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{state.sortActive=+b.dataset.sort;refresh()});
  document.querySelectorAll('.basket').forEach(z=>z.onclick=()=>{if(state.sortActive==null)return;state.classified[state.sortActive]=+z.querySelector('[data-bin]').dataset.bin;state.sortActive=null;refresh()});
  refresh();
}else{
  document.querySelectorAll('[data-n]').forEach(b=>{
    b.onclick=(e)=>{let n=+b.dataset.n;if(q.type==='fillMulti'&&(!state.fillValues[n]||e.target.closest('.slot'))){chooseFillCard(n);return}else select(n,q)};
    if(q.type==='drag'){b.ondragover=e=>{e.preventDefault();b.classList.add('dragover')};b.ondragleave=()=>b.classList.remove('dragover');b.ondrop=e=>{e.preventDefault();b.classList.remove('dragover');select(+b.dataset.n,q)}}
  });
  document.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>putLetter(b.dataset.letter,q));
  if(q.type==='fillMulti')chooseFillCard(order[0]);
  if(q.type==='mazePath'){
    const note=document.querySelector('#mazeNote');
    document.querySelector('#mazeBack').onclick=()=>{
      if(!state.selected.length){note.textContent='Маршрут пока пуст.';return}
      state.selected.pop();
      note.textContent=state.selected.length?'Шаг назад. Выбери новое продолжение.':'Маршрут очищен. Начни со старта.';

    document.querySelector('#mazeReset').onclick=()=>{
      state.selected=[];

  }
  if(q.type==='drag'){
    let t=document.querySelector('#dragToken');
    t.onclick=()=>{let on=t.getAttribute('aria-pressed')!=='true';t.setAttribute('aria-pressed',on);t.textContent=on?`✓ ${q.token||'выращенный'} — выбрано`:(q.token||'выращенный')};
    t.ondragstart=e=>e.dataTransfer.setData('text/plain',q.token||'выращенный');
    let draggingToken=false;t.onpointerdown=()=>draggingToken=true;
    document.onpointerup=e=>{if(!draggingToken)return;draggingToken=false;let z=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-n]');if(z)select(+z.dataset.n,q)}
  }
}
document.querySelector('#check').onclick=()=>check(real,q);
sync()
}
function refreshSelection(q){
  document.querySelectorAll('[data-n]').forEach(b=>{
    let step=state.selected.indexOf(+b.dataset.n),on=step>=0;
    b.classList.toggle('selected',on);
    b.setAttribute('aria-pressed',on);
    if(q.type==='mazePath')b.dataset.step=on?step+1:'';
  });
  document.querySelector('#check').disabled=q.type==='mazePath'?state.selected.at(-1)!==15:!state.selected.length;
}
function select(n,q){
  if(q.type==='mazePath'){
    let note=document.querySelector('#mazeNote'),last=state.selected.at(-1),existing=state.selected.indexOf(n);
    if(!state.selected.length&&n!==0){
      note.textContent='Начать маршрут нужно со старта.';
      return;
    }
    if(existing>=0){
      if(existing===state.selected.length-1){
        state.selected.pop();
        note.textContent=state.selected.length?'Шаг назад. Выбери новое продолжение.':'Маршрут очищен. Начни со старта.';
      }else{
        state.selected=state.selected.slice(0,existing+1);
        note.textContent=`Вернулись к шагу ${existing+1}. Теперь можно выбрать другой путь.`;
      }
      refreshSelection(q);
      return;
    }
    let cols=4,dr=Math.abs(Math.floor(last/cols)-Math.floor(n/cols)),dc=Math.abs(last%cols-n%cols),
        adjacent=last===undefined||(dr<=1&&dc<=1&&(dr+dc)>0);
    if(!adjacent){
      note.textContent='Так пойти нельзя: выбери соседнюю клетку по вертикали, горизонтали или диагонали.';
      return;
    }
    state.selected.push(n);
    note.textContent=n===15?'Финиш достигнут — теперь проверь маршрут.':`Выбрано шагов: ${state.selected.length}.`;
  }else if(q.type==='multi'||q.type==='fillMulti'||q.type==='context'){
    state.selected.includes(n)?state.selected=state.selected.filter(x=>x!==n):state.selected.push(n);
  }else{
    state.selected=[n];
  }
  refreshSelection(q);
}
function equal(a,b){let aa=[].concat(a).sort().join(','),bb=[].concat(b).sort().join(',');return aa===bb}
function retryMessage(real,attempt){const messages=['Хорошая попытка! Перечитай условие и попробуй ещё раз — у тебя получится.','Пока не совпало. Сравни все варианты внимательнее и сделай новую попытку.','Не сдавайся! Если нужно, открой «Теорию», затем проверь своё решение ещё раз.','Ты уже близко. Проверь каждый выбранный элемент и попробуй изменить решение.','Ошибаться нормально: именно так правило запоминается. Попробуй ещё раз.'];return messages[(real+attempt-1)%messages.length]}
function check(real,q){let spellingOk=q.type!=='fillMulti'||q.letters.every((x,i)=>state.fillValues[i]===x),selectionOk=q.type==='classify'?equal(state.classified,q.a):equal(state.selected,q.a),ok=q.type==='classify'?selectionOk:(selectionOk&&spellingOk),prev=state.answers.find(a=>a.index===real);if(!state.retry){if(prev){prev.attempts++;if(ok)prev.correct=true}else state.answers.push({index:real,correct:ok,first:ok,attempts:1,cat:q.cat})}let attempts=prev?prev.attempts:1,f=document.querySelector('#feedback');f.className='feedback '+(ok?'ok':'bad');f.innerHTML=ok?`<strong>Верно!</strong> ${q.why}`:(q.type==='fillMulti'?(spellingOk?`<strong>Буквы вставлены верно.</strong> Ошибка во второй части: проверь, какие слова и сочетания ты отметил.`:(selectionOk?`<strong>Слова выбраны верно.</strong> Ошибка в первой части: проверь вставленные буквы. Нажми на подчёркнутую букву в нужной карточке, чтобы изменить её.`:`<strong>Есть две ошибки.</strong> Проверь и вставленные буквы, и выбор слов. Букву можно изменить нажатием прямо на подчёркнутую букву.`)):`<strong>Попробуй ещё раз.</strong> ${retryMessage(real,attempts)}`);document.querySelectorAll('[data-n]').forEach(b=>b.disabled=true);let btn=document.querySelector('#check');btn.disabled=false;btn.textContent=ok?'Дальше':'Попробовать ещё';btn.onclick=()=>{if(!ok){if(q.type==='classify'){renderTask();return}
document.querySelectorAll('[data-n]').forEach(b=>{b.disabled=false});
if(q.type==='fillMulti'){
  if(!selectionOk){
    state.selected=[];
    document.querySelectorAll('[data-n]').forEach(b=>{b.classList.remove('selected');b.setAttribute('aria-pressed','false')});
  }else{
    refreshSelection(q);
  }
  state.activeFill=null;
  document.querySelectorAll('.fill-card').forEach(b=>b.classList.remove('active'));
  document.querySelector('#fillHelp').textContent=!spellingOk
    ?'Исправь неверную букву: нажми прямо на подчёркнутую букву в любой карточке и выбери новую.'
    :'Буквы верны. Исправь только выбор карточек.';
}else{
  document.querySelectorAll('[data-n]').forEach(b=>{b.classList.remove('selected');b.setAttribute('aria-pressed','false')});
  state.selected=[];
}
btn.disabled=true;btn.textContent='Проверить';f.innerHTML='';f.className='';btn.onclick=()=>check(real,q);return}next(real,q)};sync()}
function next(real,q){if(state.retry){state.retryPos++;if(state.retryPos>=state.retryList.length){state.retry=false;renderReflection()}else renderTask();return}if((real+1)%6===0){renderReward(q.s);return}state.i++;renderTask()}
function renderReward(s){scene.innerHTML=`<div class="hero"><span class="badge">Серия завершена</span><h1>${skills[s].place} спасена</h1><p>Освоенный навык изменил общую карту.</p></div><div class="content"><div class="resource"><img class="asset-thumb" src="02_assets/${skills[s].asset}" alt=""><b>${skills[s].resource}</b><span>Добавлено на карту спасения.</span></div><div class="reward-art"><img class="resource-art" src="02_assets/${skills[s].asset}" alt="${skills[s].resource}"></div><div class="actions"><button class="primary" id="continue">${s===4?'Посмотреть результаты':'К следующей локации'}</button></div></div>`;document.querySelector('#continue').onclick=()=>{if(s===4)renderStats();else{state.i++;renderTask()}};sync()}
function renderStats(){state.screen='stats';let first=state.answers.filter(a=>a.first).length,attempts=state.answers.reduce((x,a)=>x+a.attempts,0);let rows=skills.map((s,n)=>{let a=state.answers.filter(x=>tasks[x.index].s===n),c=a.filter(x=>x.correct).length;return `<tr><td>${s.name}</td><td>${c}/6</td><td>${a.filter(x=>x.first).length}</td></tr>`}).join('');let cats={};state.answers.filter(a=>!a.first).forEach(a=>cats[a.cat]=(cats[a.cat]||0)+1);let errors=Object.keys(cats).length?Object.entries(cats).map(([k,v])=>`<li>${k}: ${v}</li>`).join(''):'<li>Ошибок в первой попытке нет.</li>';scene.innerHTML=`<div class="hero"><span class="badge">Первая статистика сохранена</span><h1>Карта почти собрана</h1><p>Прогресс показывает путь, а не оценку. Посмотри, что уже получается.</p></div><div class="content"><div class="start-grid"><div class="card"><h2>Итог миссии</h2><p><b>Выполнено:</b> ${state.answers.length}/30<br><b>Верно с первой попытки:</b> ${first}/30<br><b>Всего попыток:</b> ${attempts}</p><table class="stats"><thead><tr><th>Навык</th><th>Освоено</th><th>С первой</th></tr></thead><tbody>${rows}</tbody></table></div><div class="card"><h2>Анализ ошибок</h2><ul>${errors}</ul><p>РНО повторяет только задания, где первая попытка была неверной; эта статистика останется без изменений.</p><button class="primary" id="rno">${state.answers.some(a=>!a.first)?'Начать РНО':'К рефлексии'}</button></div></div></div>`;document.querySelector('#rno').onclick=()=>{state.retryList=state.answers.filter(a=>!a.first).map(a=>a.index);if(state.retryList.length){state.retry=true;state.retryPos=0;renderTask()}else renderReflection()};sync()}
function renderReflection(){state.screen='reflection';scene.innerHTML=`<div class="hero"><span class="badge">Рефлексия · не влияет на результат</span><h1>Что стало твоей суперсилой?</h1><p>Выбери один ответ — он нужен только тебе.</p></div><div class="content"><div class="card"><div class="reflection">${['Теперь я сначала определяю условие выбора.','Я лучше замечаю исключения.','Я отличаю омонимичные корни.','Я научился находить корни в тексте.'].map((x,n)=>`<label><input type="radio" name="r" value="${n}">${x}</label>`).join('')}</div><div class="actions"><button class="primary" id="finish" disabled>Открыть финал</button></div></div></div>`;document.querySelectorAll('[name=r]').forEach(r=>r.onchange=()=>{state.reflection=r.value;document.querySelector('#finish').disabled=false});document.querySelector('#finish').onclick=renderFinal;sync()}
function renderFinal(){state.screen='final';scene.innerHTML=`<div class="hero"><span class="badge">Миссия выполнена</span><h1>Лес снова дышит</h1><p>Плот вывез жителей из воды, огнетушитель остановил огонь, фонарь рассеял туман, компас вернул тропы, а маяк собрал всех вместе.</p></div><div class="content"><div class="final-scene"><img class="final-scene-bg" src="02_assets/saved_forest_bg.png" alt="Карта спасённого леса"><img class="final-friends" src="02_assets/forest_friends.png" alt="Спасённые лесные жители"></div><div class="final-map">${skills.map(s=>`<div class="card"><img class="asset-thumb" src="02_assets/${s.asset}" alt=""><b>${s.resource}</b><small style="display:block">${s.name}</small></div>`).join('')}</div><div class="resource"><img class="resource-badge" src="02_assets/guardian_badge.png" alt="Знак Хранителя корней"><span><b>Знак Хранителя корней</b>: каждый освоенный навык стал частью спасённого мира.</span></div><div class="actions"><button class="secondary" id="statsAgain">Статистика</button><button class="primary" id="restart">Пройти заново</button></div></div>`;document.querySelector('#statsAgain').onclick=renderStats;document.querySelector('#restart').onclick=()=>{clearBoard();state={screen:'start',i:0,answers:[],selected:[],retry:false,retryList:[],retryPos:0,reflection:''};renderStart()};sync()}
function sync(){scene.dataset.view=state.screen;scene.dataset.series=state.screen==='task'?String(currentTask()?.s??0):state.screen==='start'?'0':'';renderMap();progress()}
new MutationObserver(()=>{if(state.screen!=='task')return;let real=state.retry?state.retryList[state.retryPos]:state.i,q=tasks[real];if(!q?.paint)return;let box=document.querySelector('#options');if(!box)return;box.className='paint-strip';box.querySelectorAll('[data-n]').forEach(b=>{b.className='paint-part'+(state.selected.includes(+b.dataset.n)?' selected':'')})}).observe(scene,{childList:true,subtree:true});
// Прозрачная доска: canvas лежит над заданием, а DOM задания не пересоздаётся.
const layer=document.querySelector('#boardLayer'),canvas=document.querySelector('#board'),ctx=canvas.getContext('2d');let drawing=false,last=null;
function resizeBoard(){let d=devicePixelRatio||1,rect=canvas.getBoundingClientRect();let old=document.createElement('canvas');old.width=canvas.width;old.height=canvas.height;old.getContext('2d').drawImage(canvas,0,0);canvas.width=rect.width*d;canvas.height=rect.height*d;ctx.scale(d,d);ctx.lineWidth=4;ctx.lineCap='round';ctx.strokeStyle='#d54c45';if(old.width)ctx.drawImage(old,0,0,old.width/d,old.height/d)}
function point(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.onpointerdown=e=>{drawing=true;last=point(e);canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drawing)return;let p=point(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p};canvas.onpointerup=()=>drawing=false;canvas.onpointercancel=()=>drawing=false;
document.querySelector('#boardOpen').onclick=()=>{layer.hidden=false;requestAnimationFrame(resizeBoard);document.querySelector('#boardClose').focus()};document.querySelector('#boardClose').onclick=()=>{layer.hidden=true;document.querySelector('#boardOpen').focus()};function clearBoard(){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.restore()}document.querySelector('#boardClear').onclick=clearBoard;window.addEventListener('resize',()=>{if(!layer.hidden)resizeBoard()});
document.addEventListener('keydown',e=>{if(e.target?.matches?.('button')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.click()}});
document.addEventListener('keydown',e=>{if(state.screen!=='task'||state.activeFill==null||!['а','о','е','и'].includes(e.key.toLowerCase()))return;let real=state.retry?state.retryList[state.retryPos]:state.i,q=tasks[real];if(q.type==='fillMulti'){e.preventDefault();putLetter(e.key,q)}});

(function(){
  const m=location.hash.match(/^#resume=(\d+)$/);
  if(m){
    const oneBased=Math.max(1,Math.min(30,Number(m[1])||1));
    const idx=oneBased-1;
    state.i=idx;
    state.answers=Array.from({length:idx},(_,i)=>({index:i,correct:true,first:true,attempts:1,cat:tasks[i].cat}));
    state.screen='task';
    renderTask();
  }else{
    renderStart();
  }
})();
</script></body></html>
