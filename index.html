<script>
const skills=[
{name:'Условия выбора',place:'Затопленная низина',resource:'Брёвна для плота',asset:'raft_logs.png',theory:'Сначала определи, от чего зависит гласная: от ударения, суффикса -а-, следующей согласной или значения. Только затем применяй частное правило.',example:'Пример: прикоснуться — после корня нет суффикса -а-, поэтому -кос-.'},
{name:'Буквы и исключения',place:'Пожарная поляна',resource:'Огнетушитель',asset:'fire_extinguisher.png',theory:'Выдели корень, назови условие, выбери букву и отдельно проверь список исключений. Для -раст-/-ращ-/-рос-: а перед ст, щ; о перед с.',example:'Пример: подросший — перед с пишется о.'},
{name:'Омонимичные корни',place:'Туман омонимов',resource:'Фонарь',asset:'lantern.png',theory:'Совпадение букв ещё не доказывает чередование. Уточни значение и способ проверки: правило чередования, проверочное слово, словарь или другая морфема.',example:'Пример: гора — проверяем словом горы; это не -гар-/-гор- со значением горения.'},
{name:'Сложные слова',place:'Заросшая тропа',resource:'Компас',asset:'compass.png',theory:'В сложном слове два корня. Раздели его на смысловые части, найди соединительную гласную, затем проверь каждый корень отдельно.',example:'Пример: водоросли → вод- + -рос-; нужный корень стоит вторым.'},
{name:'Поиск в контексте',place:'Башня наблюдения',resource:'Сигнальный маяк',asset:'signal_beacon.png',theory:'Читай текст в два прохода: сначала отмечай знакомые модели корней, затем проверяй значение и условие написания каждого кандидата.',example:'Пример: «Трава подросла у воды» — кандидат подросла, корень -рос-.'}
];
const Q=(s,p,o,a,x='single',y='',z='условие выбора')=>{const kinds=['single','multi','fillMulti','paint','maze','mazePath','drag'];return kinds.includes(x)?{s,p,o,a,type:x,why:y,cat:z}:{s,p,o,a,type:kinds.includes(y)?y:'single',why:x,cat:kinds.includes(y)?z:(y||z)}};
const tasks=[
Q(0,'Какое условие управляет корнем в слове «прикосновение»?',['ударение','суффикс -а- после корня','значение слова','последняя согласная'],1,'В паре -кас-/-кос- выбор зависит от суффикса -а-.'),
Q(0,'Перемести карточку «выращенный» в зону с нужным условием. Можно перетащить её мышью или выбрать карточку и нажать на зону.',['ударение','суффикс -а-','следующая согласная','значение'],2,'В -раст-/-ращ-/-рос- важна следующая согласная.','drag'),
Q(0,'Выбери группу, где выбор зависит от значения.',['-гар-/-гор-, -зар-/-зор-','-бер-/-бир-, -тер-/-тир-','-мак-/-мок-, -равн-/-ровн-','-кас-/-кос-, -лаг-/-лож-'],2,'У этих пар различаются смысловые оттенки.'),
Q(0,'Что нужно проверить первым в слове «загорелый»?',['наличие суффикса -а-','ударение в корне','значение «покрывшийся загаром»','букву после корня'],1,'Для -гар-/-гор- ключевое условие — ударение.'),
Q(0,'Выбери все пары, зависящие от суффикса -а-.',['-кас-/-кос-','-бер-/-бир-','-раст-/-рос-','-мак-/-мок-'],[0,1],'У -кас-/-кос- и е/и-чередований учитывается суффикс -а-.','multi'),
Q(0,'Расставь шаги алгоритма: какой шаг идёт сразу после выделения корня?',['вспомнить исключения','назвать условие выбора','поставить оценку','переписать слово'],1,'После выделения корня определяют условие выбора.'),
Q(1,'Вставь букву: заг…реть у костра.',['а','о'],1,'Без ударения в -гар-/-гор- пишется о.','single','условие выбора'),
Q(1,'Вставь букву: прик…саться к коре.',['а','о'],0,'После корня есть суффикс -а-, поэтому -кас-.','single','условие выбора'),
Q(1,'Вставь букву: молодая пор…сль.',['а','о'],1,'Поросль пишется через о по основному правилу: перед с без последующего т пишется о.','single','условие выбора'),
Q(1,'Выбери правильное слово для сообщения леснику.',['собирём припасы','соберём припасы','собирем припасы','собирём припасы'],1,'Нет суффикса -а-, значит пишется -бер-.','single','условие выбора'),
Q(1,'Пройди по лабиринту от старта к финишу, выбирая только слова, в корнях которых на месте пропуска пишется буква о. Ходить можно вверх, вниз, вправо и влево.',['разг..рается','прик..саться','соб..рать','прик..снулся','выр..щенный','выт..реть','выр..внять','изл..жить','выр..сли'],[0,3,6,7,8],'Маршрут верен: разгорается → прикоснулся → выровнять → изложить → выросли. Во всех выбранных корнях на месте пропуска пишется о.','mazePath','условие выбора'),
Q(1,'Сначала вставь пропущенную букву в каждом слове, затем выбери два исключения.',['р..сток','к..сание','..трасль','з..рница'],[0,2],'Росток и отрасль — исключения.','fillMulti','исключение'),
Q(2,'В каком слове -гор- является чередующимся корнем?',['горевать о друге','гористая местность','загореться от искры','горчичный цвет'],2,'В слове «загореться» действует чередование -гар-/-гор-. В остальных вариантах гласная относится к другим, омонимичным корням.','single','омоним'),
Q(2,'В каком слове сочетание -рос- только похоже на чередующийся корень -раст-/-ращ-/-рос-, но входит в другой корень?',['зар..сли','водор..сли','р..скошный','выр..сли'],2,'Роскошный имеет корень -роскош-. В остальных словах представлен чередующийся корень -раст-/-ращ-/-рос-.','single','омоним'),
Q(2,'Какие слова имеют проверяемую гласную, а не чередование?',['гористый','горевать','загорелый','поклониться'],[0,1],'Гористый проверяется словом горы, горевать — горе.','multi','омоним'),
Q(2,'Как доказать написание слова «творение»?',['подобрать «затвор»','применить правило -твар-/-твор-','проверить словом «тварь»','запомнить как приставку'],1,'В корне -твар-/-твор- выбор зависит от ударения: без ударения пишется о — творение, творить; под ударением пишется та гласная, которая слышится — творчество, тварь.','single','омоним'),
Q(2,'Выбери словарное слово, не относящееся к чередованию.',['озарение','озорной','зарница','зорька'],1,'Озорной — словарное слово с омонимичным сочетанием букв.','single','словарное'),
Q(2,'В каком слове похожее сочетание букв не относится к чередующемуся корню -лаг-/-лож-?',['прил..жение','предл..жить','л..жбина','изл..жение'],2,'В слове «ложбина» выделяется корень -ложбин-. В остальных словах действует чередование -лаг-/-лож-.','single','омоним'),
Q(3,'Закрась корень с чередованием в слове «прикосновение».',['при','кос','нов','ени','е'],[1],'В слове «прикосновение» чередующийся корень -кос-.','paint','не видит корень'),
Q(3,'Закрась корень с чередованием в слове «равноправный».',['равн','о','прав','н','ый'],[0],'В слове «равноправный» чередующийся корень -равн-.','paint','не видит корень'),
Q(3,'Закрась корень с чередованием в слове «плодотворный».',['плод','о','твор','н','ый'],[2],'В слове «плодотворный» чередующийся корень -твор-.','paint','не видит корень'),
Q(3,'Закрась корень с чередованием в слове «светозарный».',['свет','о','зар','н','ый'],[2],'В слове «светозарный» чередующийся корень -зар-.','paint','не видит корень'),

let state={screen:'start',i:0,answers:[],selected:[],retry:false,retryList:[],retryPos:0,reflection:''};

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function fillMarkup(word,n){let value=state.fillValues?.[n]||'',parts=word.split('..');return `${esc(parts[0])}<span class="slot" aria-label="пропущенная буква">${esc(value)}</span>${esc(parts[1]||'')}`}
function chooseFillCard(n){state.activeFill=n;document.querySelectorAll('.fill-card').forEach(b=>b.classList.toggle('active',+b.dataset.n===n));document.querySelector('#fillHelp').textContent=`Вставь букву в слово «${tasks[state.retry?state.retryList[state.retryPos]:state.i].o[n]}» с клавиатуры или выбери ниже.`}
function putLetter(letter,q){if(state.activeFill==null)return;state.fillValues[state.activeFill]=letter.toLowerCase();let card=document.querySelector(`[data-n="${state.activeFill}"]`);card.innerHTML=fillMarkup(q.o[state.activeFill],state.activeFill);card.classList.add('filled');card.classList.remove('active');card.setAttribute('aria-label',q.o[state.activeFill].replace('..',letter)+'. Нажмите ещё раз, чтобы выбрать как ответ.');let next=q.o.findIndex((_,i)=>!state.fillValues[i]);state.activeFill=next<0?null:next;if(next>=0)chooseFillCard(next);else document.querySelector('#fillHelp').textContent='Все пропуски заполнены. Теперь выбери карточки, которые отвечают на вопрос.'}
function renderMap(){map.innerHTML='<h2>Карта спасения</h2>'+skills.map((s,n)=>{let current=state.screen==='task'?tasks[state.i]?.s:state.screen==='start'?0:5,done=state.answers.filter(a=>a&&tasks[a.index].s===n).length>=6;return `<div class="map-step ${done?'done':''} ${current===n?'active':''}"><div class="dot">${done?'✓':n+1}</div><div><strong>${s.place}</strong><small><img class="map-avatar" src="02_assets/${done?s.asset:'owl_guardian.png'}" alt="">${done?s.resource:'Сова ждёт помощи'}</small></div></div>`}).join('')}
function progress(){let n=state.answers.length;document.querySelector('#progressText').textContent=`Путь: ${n} из 30`;document.querySelector('#seriesText').textContent=state.screen==='task'?`Локация ${tasks[state.i].s+1}/5`:state.screen==='final'?'Лес спасён':'Миссия';document.querySelector('.track').setAttribute('aria-valuenow',n);document.querySelector('#fill').style.width=(n/30*100)+'%'}
function renderStart(){state.screen='start';scene.innerHTML=`<div class="hero intro-hero"><span class="badge">Миссия по русскому языку · 6–11 класс</span><h1>Лес теряет свои корни</h1><p>Наводнение, огонь и туман разорвали лесные тропы. Ты — герой-собиратель: освой пять навыков и верни жителям всё, что поможет спасти дом.</p></div><div class="content"><div class="start-grid"><div class="card"><h2>Твоя учебная цель</h2><p>Систематизировать корни с чередованием, выбирать верную гласную, помнить исключения и отличать омонимичные корни в словах и тексте.</p><div class="resource character-callout"><img src="02_assets/owl_guardian.png" alt="Сова-хранитель"><span>Сова-хранитель будет выдавать детали после каждой серии.</span></div><button class="primary" id="start">Начать миссию</button></div><div class="card"><h2>Как действовать</h2><ol><li>Прочитай условие.</li><li>При необходимости открой «Теорию».</li><li>Выбери ответ и проверь.</li><li>Ошибки можно повторить в РНО.</li></ol><p><b>Доска</b> открывается поверх задания и не влияет на попытки.</p></div></div></div>`;document.querySelector('#start').onclick=()=>{state.screen='task';renderTask()};sync()}
function currentTask(){return tasks[state.retry?state.retryList[state.retryPos]:state.i]}
function renderTask(){state.screen='task';let real=state.retry?state.retryList[state.retryPos]:state.i,q=tasks[real],sk=skills[q.s],hint=hints[real];state.selected=[];state.fillValues=q.type==='fillMulti'?Array(q.o.length).fill(''):[];state.activeFill=q.type==='fillMulti'?0:null;let cls=(q.type==='maze'||q.type==='mazePath')?'options maze':(q.type==='multi'||q.type==='fillMulti')?'word-grid':'options',token=q.type==='drag'?'<button class="drag-token" id="dragToken" draggable="true" aria-pressed="false">выращенный</button>':'',mazeNote=q.type==='mazePath'?'<div class="maze-note" id="mazeNote" aria-live="polite">Начни с клетки «разг..рается».</div>':'',fillTray=q.type==='fillMulti'?'<p class="fill-help" id="fillHelp">Выбери букву для первой карточки с клавиатуры или нажми кнопку.</p><div class="letter-tray" aria-label="Выбор буквы"><button data-letter="а">а</button><button data-letter="о">о</button><button data-letter="е">е</button><button data-letter="и">и</button></div>':'';scene.innerHTML=`<div class="hero"><span class="badge">${state.retry?'РНО · работа над ошибками':`Серия ${q.s+1} · задание ${real%6+1}/6`}</span><h1>${sk.place}</h1><p>${q.s===0?'Вода прибывает. Разложи правила по верным маршрутам.':q.s===1?'Останови огонь точными решениями.':q.s===2?'Фонарь зажжётся, если отличить похожие корни.':q.s===3?'Найди скрытые корни и восстанови тропу.':'Подай верный сигнал всему лесу.'}</p></div><div class="content"><div class="task-head"><div><div class="kicker">Навык: ${sk.name}</div><h2>${state.retry?'Повторяем ошибку':'Продолжай спасение'}</h2></div><button class="theory-btn" id="theoryBtn" aria-expanded="false" aria-controls="theoryCard">Теория</button></div><div class="theory" id="theoryCard" hidden><strong>Правило для этого задания</strong><p>${hint.rule}</p><p class="example">${hint.example}</p></div><div class="prompt">${q.p}</div>${token}<div class="${cls}" id="options">${q.o.map((o,n)=>`<button class="${(q.type==='multi'||q.type==='fillMulti')?'word':'option'} ${q.type==='fillMulti'?'fill-card':''} ${q.type==='drag'?'dropzone':''}" data-n="${n}" aria-pressed="false">${q.type==='fillMulti'?fillMarkup(o,n):esc(o)}</button>`).join('')}</div>${mazeNote}${fillTray}<div id="feedback" aria-live="assertive"></div><div class="actions"><button class="primary" id="check" disabled>Проверить</button></div></div>`;let tb=document.querySelector('#theoryBtn'),tc=document.querySelector('#theoryCard');tb.onclick=()=>{let open=tb.getAttribute('aria-expanded')==='true';tb.setAttribute('aria-expanded',String(!open));tc.hidden=open};document.querySelectorAll('[data-n]').forEach(b=>{b.onclick=()=>{let n=+b.dataset.n;if(q.type==='fillMulti'&&!state.fillValues[n])chooseFillCard(n);else select(n,q)};if(q.type==='drag'){b.ondragover=e=>{e.preventDefault();b.classList.add('dragover')};b.ondragleave=()=>b.classList.remove('dragover');b.ondrop=e=>{e.preventDefault();b.classList.remove('dragover');select(+b.dataset.n,q)}}});document.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>putLetter(b.dataset.letter,q));if(q.type==='fillMulti')chooseFillCard(0);if(q.type==='drag'){let t=document.querySelector('#dragToken');t.onclick=()=>{let on=t.getAttribute('aria-pressed')!=='true';t.setAttribute('aria-pressed',on);t.textContent=on?'✓ выращенный — выбрано':'выращенный'};t.ondragstart=e=>e.dataTransfer.setData('text/plain','выращенный')}document.querySelector('#check').onclick=()=>check(real,q);sync()}
function select(n,q){if(q.type==='mazePath'){let note=document.querySelector('#mazeNote'),last=state.selected.at(-1);if(!state.selected.length&&n!==0){note.textContent='Начать маршрут нужно со старта.';return}if(n===last){state.selected.pop();note.textContent=state.selected.length?'Шаг назад. Продолжай от выделенной клетки.':'Маршрут очищен. Начни со старта.'}else{let adjacent=last===undefined||Math.abs(Math.floor(last/3)-Math.floor(n/3))+Math.abs(last%3-n%3)===1;if(!adjacent||state.selected.includes(n)){note.textContent='Так пойти нельзя: выбери соседнюю клетку вверх, вниз, вправо или влево.';return}state.selected.push(n);note.textContent=n===8?'Финиш достигнут — теперь проверь маршрут.':`Выбрано шагов: ${state.selected.length}.`} }else if(q.type==='multi'||q.type==='fillMulti'){state.selected.includes(n)?state.selected=state.selected.filter(x=>x!==n):state.selected.push(n)}else state.selected=[n];document.querySelectorAll('[data-n]').forEach(b=>{let step=state.selected.indexOf(+b.dataset.n),on=step>=0;b.classList.toggle('selected',on);b.setAttribute('aria-pressed',on);if(q.type==='mazePath')b.dataset.step=on?step+1:''});document.querySelector('#check').disabled=q.type==='mazePath'?state.selected.at(-1)!==8:!state.selected.length}
function equal(a,b){let aa=[].concat(a).sort().join(','),bb=[].concat(b).sort().join(',');return aa===bb}
function retryMessage(real,attempt){const messages=['Хорошая попытка! Перечитай условие и попробуй ещё раз — у тебя получится.','Пока не совпало. Сравни все варианты внимательнее и сделай новую попытку.','Не сдавайся! Если нужно, открой «Теорию», затем проверь своё решение ещё раз.','Ты уже близко. Проверь каждый выбранный элемент и попробуй изменить решение.','Ошибаться нормально: именно так правило запоминается. Попробуй ещё раз.'];return messages[(real+attempt-1)%messages.length]}
function check(real,q){let spellingOk=q.type!=='fillMulti'||q.letters.every((x,i)=>state.fillValues[i]===x),ok=equal(state.selected,q.a)&&spellingOk,prev=state.answers.find(a=>a.index===real);if(!state.retry){if(prev){prev.attempts++;if(ok)prev.correct=true}else state.answers.push({index:real,correct:ok,first:ok,attempts:1,cat:q.cat})}let attempts=prev?prev.attempts:1,f=document.querySelector('#feedback');f.className='feedback '+(ok?'ok':'bad');f.innerHTML=ok?`<strong>Верно!</strong> ${q.why}`:`<strong>Попробуй ещё раз.</strong> ${retryMessage(real,attempts)}`;document.querySelectorAll('[data-n]').forEach(b=>b.disabled=true);let btn=document.querySelector('#check');btn.disabled=false;btn.textContent=ok?'Дальше':'Попробовать ещё';btn.onclick=()=>{if(!ok){document.querySelectorAll('[data-n]').forEach(b=>{b.disabled=false;b.classList.remove('selected');b.setAttribute('aria-pressed','false')});state.selected=[];if(q.type==='fillMulti'){state.fillValues=Array(q.o.length).fill('');document.querySelectorAll('.fill-card').forEach((b,n)=>{b.innerHTML=fillMarkup(q.o[n],n);b.classList.remove('filled','active')});state.activeFill=0;chooseFillCard(0)}btn.disabled=true;btn.textContent='Проверить';f.innerHTML='';f.className='';btn.onclick=()=>check(real,q);return}next(real,q)};sync()}
function next(real,q){if(state.retry){state.retryPos++;if(state.retryPos>=state.retryList.length){state.retry=false;renderReflection()}else renderTask();return}if((real+1)%6===0){renderReward(q.s);return}state.i++;renderTask()}
function renderReward(s){scene.innerHTML=`<div class="hero"><span class="badge">Серия завершена</span><h1>${skills[s].place} спасена</h1><p>Освоенный навык изменил общую карту.</p></div><div class="content"><div class="resource"><img class="asset-thumb" src="02_assets/${skills[s].asset}" alt=""><b>${skills[s].resource}</b><span>Добавлено на карту спасения.</span></div><div class="reward-art"><img class="resource-art" src="02_assets/${skills[s].asset}" alt="${skills[s].resource}"></div><div class="actions"><button class="primary" id="continue">${s===4?'Посмотреть результаты':'К следующей локации'}</button></div></div>`;document.querySelector('#continue').onclick=()=>{if(s===4)renderStats();else{state.i++;renderTask()}};sync()}
function renderStats(){state.screen='stats';let first=state.answers.filter(a=>a.first).length,attempts=state.answers.reduce((x,a)=>x+a.attempts,0);let rows=skills.map((s,n)=>{let a=state.answers.filter(x=>tasks[x.index].s===n),c=a.filter(x=>x.correct).length;return `<tr><td>${s.name}</td><td>${c}/6</td><td>${a.filter(x=>x.first).length}</td></tr>`}).join('');let cats={};state.answers.filter(a=>!a.first).forEach(a=>cats[a.cat]=(cats[a.cat]||0)+1);let errors=Object.keys(cats).length?Object.entries(cats).map(([k,v])=>`<li>${k}: ${v}</li>`).join(''):'<li>Ошибок в первой попытке нет.</li>';scene.innerHTML=`<div class="hero"><span class="badge">Первая статистика сохранена</span><h1>Карта почти собрана</h1><p>Прогресс показывает путь, а не оценку. Посмотри, что уже получается.</p></div><div class="content"><div class="start-grid"><div class="card"><h2>Итог миссии</h2><p><b>Выполнено:</b> ${state.answers.length}/30<br><b>Верно с первой попытки:</b> ${first}/30<br><b>Всего попыток:</b> ${attempts}</p><table class="stats"><thead><tr><th>Навык</th><th>Освоено</th><th>С первой</th></tr></thead><tbody>${rows}</tbody></table></div><div class="card"><h2>Анализ ошибок</h2><ul>${errors}</ul><p>РНО повторяет только задания, где первая попытка была неверной; эта статистика останется без изменений.</p><button class="primary" id="rno">${state.answers.some(a=>!a.first)?'Начать РНО':'К рефлексии'}</button></div></div></div>`;document.querySelector('#rno').onclick=()=>{state.retryList=state.answers.filter(a=>!a.first).map(a=>a.index);if(state.retryList.length){state.retry=true;state.retryPos=0;renderTask()}else renderReflection()};sync()}
function renderReflection(){state.screen='reflection';scene.innerHTML=`<div class="hero"><span class="badge">Рефлексия · не влияет на результат</span><h1>Что стало твоей суперсилой?</h1><p>Выбери один ответ — он нужен только тебе.</p></div><div class="content"><div class="card"><div class="reflection">${['Теперь я сначала определяю условие выбора.','Я лучше замечаю исключения.','Я отличаю омонимичные корни.','Я научился находить корни в тексте.'].map((x,n)=>`<label><input type="radio" name="r" value="${n}">${x}</label>`).join('')}</div><div class="actions"><button class="primary" id="finish" disabled>Открыть финал</button></div></div></div>`;document.querySelectorAll('[name=r]').forEach(r=>r.onchange=()=>{state.reflection=r.value;document.querySelector('#finish').disabled=false});document.querySelector('#finish').onclick=renderFinal;sync()}
function renderFinal(){state.screen='final';scene.innerHTML=`<div class="hero"><span class="badge">Миссия выполнена</span><h1>Лес снова дышит</h1><p>Плот вывез жителей из воды, огнетушитель остановил огонь, фонарь рассеял туман, компас вернул тропы, а маяк собрал всех вместе.</p></div><div class="content"><div class="final-scene"><img class="final-scene-bg" src="02_assets/saved_forest_bg.png" alt="Карта спасённого леса"><img class="final-friends" src="02_assets/forest_friends.png" alt="Спасённые лесные жители"></div><div class="final-map">${skills.map(s=>`<div class="card"><img class="asset-thumb" src="02_assets/${s.asset}" alt=""><b>${s.resource}</b><small style="display:block">${s.name}</small></div>`).join('')}</div><div class="resource"><img class="resource-badge" src="02_assets/guardian_badge.png" alt="Знак Хранителя корней"><span><b>Знак Хранителя корней</b>: каждый освоенный навык стал частью спасённого мира.</span></div><div class="actions"><button class="secondary" id="statsAgain">Статистика</button><button class="primary" id="restart">Пройти заново</button></div></div>`;document.querySelector('#statsAgain').onclick=renderStats;document.querySelector('#restart').onclick=()=>{state={screen:'start',i:0,answers:[],selected:[],retry:false,retryList:[],retryPos:0,reflection:''};renderStart()};sync()}
function sync(){scene.dataset.view=state.screen;scene.dataset.series=state.screen==='task'?String(currentTask()?.s??0):state.screen==='start'?'0':'';renderMap();progress()}
new MutationObserver(()=>{if(state.screen!=='task')return;let real=state.retry?state.retryList[state.retryPos]:state.i,q=tasks[real];if(!q?.paint)return;let box=document.querySelector('#options');if(!box)return;box.className='paint-strip';box.querySelectorAll('[data-n]').forEach(b=>{b.className='paint-part'+(state.selected.includes(+b.dataset.n)?' selected':'')})}).observe(scene,{childList:true,subtree:true});
// Прозрачная доска: canvas лежит над заданием, а DOM задания не пересоздаётся.
const layer=document.querySelector('#boardLayer'),canvas=document.querySelector('#board'),ctx=canvas.getContext('2d');let drawing=false,last=null;
function resizeBoard(){let d=devicePixelRatio||1,rect=canvas.getBoundingClientRect();let old=document.createElement('canvas');old.width=canvas.width;old.height=canvas.height;old.getContext('2d').drawImage(canvas,0,0);canvas.width=rect.width*d;canvas.height=rect.height*d;ctx.scale(d,d);ctx.lineWidth=4;ctx.lineCap='round';ctx.strokeStyle='#d54c45';if(old.width)ctx.drawImage(old,0,0,old.width/d,old.height/d)}
function point(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.onpointerdown=e=>{drawing=true;last=point(e);canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drawing)return;let p=point(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p};canvas.onpointerup=()=>drawing=false;canvas.onpointercancel=()=>drawing=false;
document.querySelector('#boardOpen').onclick=()=>{layer.hidden=false;requestAnimationFrame(resizeBoard);document.querySelector('#boardClose').focus()};document.querySelector('#boardClose').onclick=()=>{layer.hidden=true;document.querySelector('#boardOpen').focus()};document.querySelector('#boardClear').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);window.addEventListener('resize',()=>{if(!layer.hidden)resizeBoard()});
document.addEventListener('keydown',e=>{if(e.target?.id==='theoryBtn'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.click()}});
document.addEventListener('keydown',e=>{if(state.screen!=='task'||state.activeFill==null||!['а','о','е','и'].includes(e.key.toLowerCase()))return;let real=state.retry?state.retryList[state.retryPos]:state.i,q=tasks[real];if(q.type==='fillMulti'){e.preventDefault();putLetter(e.key,q)}});
renderStart();
</script></body></html>
